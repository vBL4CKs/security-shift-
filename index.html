t.name)}</h3><p>${esc(current.docs)}</p><p>Aktennotiz: ${esc(current.story)}</p></div><button class="btn good" onclick="closePanel()">Unterlagen weglegen</button>`)}function skeletonSvg(){return `<svg viewBox="0 0 150 240" aria-label="Schematische Sicherheitskontrolle"><g stroke="#a8e7ec" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="75" cy="30" r="19"/><path d="M65 47L75 61L85 47M75 61V155M49 75Q75 61 101 75M49 75L38 125L31 145M101 75L112 125L119 145M54 83L75 97L96 83M53 96L75 110L97 96M56 109L75 123L94 109M59 123L75 134L91 123M75 155L58 170L54 223M75 155L92 170L96 223M64 158Q75 170 86 158"/></g><g fill="#b8f2f5"><circle cx="75" cy="30" r="4"/><circle cx="31" cy="145" r="5"/><circle cx="119" cy="145" r="5"/></g></svg>`}function scanner(){scanned=true;let danger=current.threat;panel(`<button class="x" onclick="closePanel()">×</button><h2>🔍 Sicherheits-Scanner</h2><p>Fiktiver Körperscan: Metallische Gegenstände werden hervorgehoben.</p><div class="scanbox">${skeletonSvg()}<div class="scanline"></div><div class="hotspot" style="left:${danger?'66':'24'}%;top:${danger?'46':'68'}%"></div></div><p><b>${danger?'⚠ Sicherheitswarnung':'✓ Gegenstand erkannt'}:</b> ${esc(current.metal)}</p><p class="tiny">Ein harmloser Metallgegenstand ist kein Grund für eine Festnahme. Bei einer konkreten Gefahr den Kollegen hinzuziehen.</p><button class="btn good" onclick="closePanel()">Scan abschließen</button>`)}function stamp(){panel(`<button class="x" onclick="closePanel()">×</button><h2>📄 Zutrittsentscheidung</h2><div class="paper"><h3>ZUTRITTSANTRAG</h3><p>${esc(current.name)} · Nr. ${current.id}</p><p>Grund: ${esc(current.reason)}</p><hr><p>Entscheidung: ______________</p></div><p>Stemple den Antrag oder veranlasse bei konkreter Gefahr eine Sicherung durch die Polizei.</p><div class="btnrow"><button class="btn good" onclick="decide('allow')">✓ GRÜN</button><button class="btn bad" onclick="decide('deny')">✕ ROT</button><button class="btn gold" onclick="decide('detain')">⚠ GEWAHRSAM</button></div>`)}function decide(choice){if(transitioning)return;transitioning=true;$('actions').classList.add('busy');closePanel();const v=$('visitor');if(v){v.className='visitor leaving-'+(choice==='detain'?'detain':choice==='allow'?'allow':'reject')}doorOpen();if(choice==='detain'){const a=$('escortLeft'),b=$('escortRight');if(a)a.classList.add('active');if(b)b.classList.add('active')}$('dialog').innerHTML=choice==='detain'?'<b>Festnahme</b><br>Zwei Beamte übernehmen die Person.':choice==='allow'?'<b>Zutritt erteilt</b><br>Die Person geht in den Sicherheitsbereich.':'<b>Zutritt verweigert</b><br>Die Person verlässt das Revier.';let correct=choice===current.outcome;let amount=correct?(choice==='detain'?140:80):-40;money+=amount;shiftPay+=amount;save();clearTimeout(motionTimer);motionTimer=setTimeout(()=>{transitioning=false;doorClose();idx++;if(idx>=5){endShift();return}spawn();panel(`<h2>${correct?'✓ Richtig entschieden':'⚠ Kontrollfehler'}</h2><p>${correct?'Deine Entscheidung war mit den überprüften Hinweisen vereinbar.':'Prüfe beim nächsten Mal Ausweis, Zugangsliste und konkrete Gefahrenlage genauer.'}</p><p><b>${amount>0?'+':''}${amount} €</b></p><button class="btn good" onclick="closePanel()">Nächste Person →</button>`)},1800)}function endShift(){scene='summary';$('actions').classList.add('hidden');$('dialog').classList.add('hidden');panel(`<div class="tag">SCHICHTENDE</div><h1>Feierabend</h1><p>Du hast heute fünf Personen kontrolliert. Die Kolleginnen und Kollegen übernehmen die Nachtschicht.</p><div class="paper"><h3>TAGESABRECHNUNG</h3><p>Heutiger Verdienst: <b>${shiftPay>0?'+':''}${shiftPay} €</b></p><p>Gesamtvermögen: <b>${money} €</b></p></div><button class="btn good" onclick="goHome()">Nach Hause fahren →</button>`)}function goHome(){scene='home';beer=0;$('stage').innerHTML=`<div class="scene home"><div class="tv"><div class="tvscreen"><small>LIVE · ABENDJOURNAL</small><b>REGIONALNACHRICHTEN</b><small>Die Stadt schläft nie.</small></div></div><div class="sofa"></div><div class="tablehome"></div><div class="bottles">🍺 🍺</div><div class="phoneprop">📱</div></div>`;$('homeactions').classList.remove('hidden');$('actions').classList.add('hidden');$('dialog').classList.add('hidden');closePanel();header()}function newsForDay(){let special=day%4===0||day%7===0;return special?{headline:'POLIZEI SUCHT PERSON NACH EINBRUCHSERIE',body:'Eine Person soll sich mit fremden Ausweisdaten Zugang zu gesicherten Gebäuden verschafft haben. Hinweise aus der Bevölkerung werden geprüft.',photo:people[3]}:{headline:'STADT AKTUELL: NEUE SICHERHEITSMASSNAHMEN',body:'Im Stadtgebiet werden öffentliche Gebäude besser gesichert. Die Behörden erinnern daran, dass Zeugen auch ohne Termin Hilfe erhalten können.',photo:null}}function newsHtml(){let n=newsForDay();return `<div class="tag">ABENDNACHRICHTEN · TAG ${day}</div><div class="newsimg">${n.photo?imageTag(n.photo):'🎙️ 📺'}</div><h2>${esc(n.headline)}</h2><p>Moderatorin: „Guten Abend. ${esc(n.body)}“</p><p class="tiny">Die Nachrichten sind Teil der fiktiven Spielwelt. Besondere Fahndungen erscheinen nur an einzelnen Tagen.</p>`}function watchTV(){panel(`<button class="x" onclick="closePanel()">×</button><h2>📺 Fernsehen</h2>${newsHtml()}<button class="btn good" onclick="closePanel()">Fernseher verlassen</button>`)}function drink(){beer++;if(beer>=3){panel(`<h2>😴 Du nickst ein</h2><p>Nach dem dritten Schluck werden deine Augen schwer. Der Fernseher läuft noch, während du auf dem Sofa einschläfst.</p><button class="btn good" onclick="nextDay()">Am nächsten Morgen aufwachen →</button>`)}else{panel(`<h2>🍺 Feierabend</h2><p>Du nimmst einen Schluck. ${beer===1?'Endlich Ruhe nach dem langen Dienst.':'Langsam wirst du müde.'}</p><p>Schluck ${beer} von 3</p><button class="btn good" onclick="closePanel()">Zurück zum Sofa</button>`)}}function nextDay(){day++;save();menu()}function phoneShell(body,title='SMARTPHONE'){panel(`<button class="x" onclick="closePanel()">×</button><div class="phone"><div class="phoneheader"><span>21:47</span><b>${title}</b><span>●●● 92%</span></div>${body}</div><button class="btn" onclick="phoneHome()">⌂ Startbildschirm</button><button class="btn good" onclick="closePanel()">Handy weglegen</button>`)}function phoneHome(){phoneShell(`<div class="apps"><button class="appicon" onclick="contacts()"><span>👥</span>Kontakte</button><button class="appicon" onclick="messages()"><span>💬</span>Messenger</button><button class="appicon" onclick="worldNews()"><span>🌍</span>Weltnachrichten</button></div><p class="tiny">Private Nachrichten und regionale Meldungen. Kein öffentliches soziales Netzwerk.</p>`)}
const chatPeople=[{id:'lea',name:'Lea',icon:'👩',role:'Freundin'},{id:'tom',name:'Tom',icon:'🧑',role:'Schulfreund'},{id:'berger',name:'Berger',icon:'👮',role:'Kollege'},{id:'mutter',name:'Mama',icon:'👩‍🦳',role:'Familie'}];
const chatData={lea:[['Lea','Hey! Wie war deine Schicht? ❤️']],tom:[['Tom','Kommst du am Wochenende mit raus?']],berger:[['Berger','Denk morgen an die aktuelle Fahndungsliste.']],mutter:[['Mama','Alles gut bei dir? Du hast dich länger nicht gemeldet.']]};
const chatReplies={lea:[['Anstrengend, aber alles okay.','Das klingt nach einem langen Tag. Ruh dich aus, ich bin stolz auf dich. ❤️'],['Heute war es ziemlich gefährlich.','Oh nein. Bist du in Sicherheit? Wir können morgen telefonieren.'],['Ich bin total müde.','Dann ab aufs Sofa! Schreib mir morgen, ja?']],tom:[['Ja, ich bin dabei!','Sehr gut! Ich melde mich Samstag mit der Uhrzeit.'],['Ich muss wahrscheinlich arbeiten.','Alles klar, dann ein anderes Mal. Pass auf dich auf!'],['Was hast du geplant?','Vielleicht erst Burger essen und danach ins Kino.']],berger:[['Was steht auf der Fahndungsliste?','Sieh dir die Weltnachrichten an. Bei verdächtigen Ausweisen genau prüfen.'],['Gab es neue Vorfälle?','Noch nichts Bestätigtes. Bleib aufmerksam, aber verhafte niemanden ohne konkreten Grund.'],['Danke, bis morgen.','Gute Nacht. Morgen sehen wir uns im Revier.']],mutter:[['Ja, alles gut. Bin gerade zu Hause.','Das freut mich. Iss auch etwas Vernünftiges! ❤️'],['Die Arbeit war heute stressig.','Dann schlaf dich aus. Ich rufe dich morgen an.'],['Wie geht es euch?','Uns geht es gut! Wir freuen uns, dich bald zu sehen.']]};
let chatHistory={};try{chatHistory=JSON.parse(localStorage.getItem('nightshift-chats-v1')||'{}')}catch{};
function contacts(){phoneShell(chatPeople.map(c=>`<button class="btn" style="width:100%;text-align:left" onclick="chat('${c.id}')">${c.icon} <b>${c.name}</b> <span class="tiny">· ${c.role}</span></button>`).join(''),'KONTAKTE')}
function messages(){phoneShell(chatPeople.map(c=>`<button class="btn" style="width:100%;text-align:left" onclick="chat('${c.id}')">${c.icon} <b>${c.name}</b><br><span class="tiny">${esc((chatHistory[c.id]||chatData[c.id]).slice(-1)[0][1])}</span></button>`).join(''),'MESSENGER')}
function chat(id){let c=chatPeople.find(x=>x.id===id);if(!c)return;let history=chatHistory[id]||chatData[id];let bubbles=history.map(m=>`<div class="message" style="${m[0]==='Du'?'background:#22524c;margin-left:15%':''}"><b>${esc(m[0])}</b><br>${esc(m[1])}</div>`).join('');let choices=chatReplies[id].map((r,i)=>`<button class="btn" style="width:100%;text-align:left" onclick="sendChat('${id}',${i})">${esc(r[0])}</button>`).join('');phoneShell(`<div style="max-height:38vh;overflow:auto">${bubbles}</div><p class="tiny">Wähle deine Antwort:</p>${choices}`,'CHAT · '+c.name)}
function sendChat(id,i){let c=chatPeople.find(x=>x.id===id);if(!c||!chatReplies[id][i])return;let h=chatHistory[id]||chatData[id].map(x=>x.slice());let pair=chatReplies[id][i];h.push(['Du',pair[0]],[c.name,pair[1]]);chatHistory[id]=h.slice(-20);try{localStorage.setItem('nightshift-chats-v1',JSON.stringify(chatHistory))}catch{}chat(id)}
function worldNews(){phoneShell(newsHtml(),'WELTNACHRICHTEN')}menu();
</script></body></html>
