his.style.display='none'">`}function header(){ $('progress').textContent=(day<=30?'Polizeirevier':'Krankenhaus')+' · Schicht '+(day<=30?day:day-30)+'/30';$('wallet').textContent='€ '+money}function menu(){scene='menu';$('stage').innerHTML='<div class="scene station"><div class="station-sign">NIGHT SHIFT · SECURITY</div><div class="station-floor"></div><div class="officer one"></div><div class="officer two"></div><div class="desk"><div class="monitor"></div><div class="paperdesk"></div></div></div>';$('actions').classList.add('hidden');$('homeactions').classList.add('hidden');$('dialog').classList.add('hidden');header();panel(`<div class="tag">KARRIEREKARTE</div><h1>NIGHT SHIFT</h1><p>Arbeite dich durch 30 Schichten im Polizeirevier. Danach wartet das Krankenhaus mit einem neuen Einsatzbereich.</p><div class="paper"><h3>● Einsatz ${day<=30?'01 · Polizeirevier':'02 · Krankenhaus'}</h3><p>Schicht ${day<=30?day:day-30} / 30 · Freigeschaltet</p><p>○ ${day<=30?'Krankenhaus · ab Schicht 31':'Weitere Orte · bald verfügbar'}</p><p>○ Weitere Sicherheitsstandorte · gesperrt</p></div><button class="btn good" onclick="briefing()">Schicht auswählen →</button><p class="tiny">Dein Fortschritt wird auf diesem Gerät gespeichert.</p>`)}function briefing(){panel(`<div class="tag">EINSATZBRIEFING</div><h1>${day<=30?'Polizeirevier':'Krankenhaus'}</h1><p>${day<=30?'Das Revier ist überfüllt. Du kontrollierst den Zugang zu den gesicherten Räumen, während Polizisten im Hintergrund Verdächtige vernehmen.':'Die Notaufnahme ist ausgelastet. Du schützt den Zugang zum Personal- und Behandlungsbereich.'}</p><p><b>Besonders beachten:</b> Ausweisnummern abgleichen, mitgeführte Gegenstände prüfen und unberechtigten Zutritt verhindern. Nicht jede Person ohne Termin ist gefährlich.</p><button class="btn good" onclick="startShift()">Schicht beginnen →</button>`)}function station(){return `<div class="scene station"><div class="station-floor"></div><div class="station-sign">${day<=30?'POLIZEIREVIER · EINGANG':'KLINIK · SICHERHEIT'}</div><div class="gate"></div><div class="officer one"></div><div class="officer two"></div><div class="suspect"></div><div id="visitor" class="visitor moving"></div><div class="desk"><div class="monitor"></div><div class="paperdesk"></div><div class="mug"></div></div></div>`}function renderVisitor(){const p=current;const colors=['#475b6e','#676454','#626d77','#53664c','#5e506d','#776458','#434e61','#596b70'];$('visitor').innerHTML=`<div class="body" style="background:linear-gradient(105deg,#111b24,${colors[p.photo]},#101923)"></div><div class="neck"></div><div class="head"><div class="mouth"></div></div><div class="portrait" style="background-image:url('${portrait(p)}')"></div><div class="badgebody"></div>`;let preload=new Image();preload.onerror=()=>{let v=$('visitor');if(v){v.querySelector('.portrait').style.display='none'}};preload.src=portrait(p)}function spawn(){current=people[((day-1)*2+idx)%people.length];asked=checked=scanned=false;renderVisitor();$('dialog').innerHTML='<b>Neue Person am Empfang</b><br>Frage nach dem Anliegen, prüfe Dokumente und entscheide.';header()}function startShift(){scene='work';idx=0;shiftPay=0;$('stage').innerHTML=station();$('actions').classList.remove('hidden');$('homeactions').classList.add('hidden');$('dialog').classList.remove('hidden');closePanel();spawn()}function talk(){asked=true;panel(`<button class="x" onclick="closePanel()">×</button><h2>💬 Besuchergespräch</h2><p><b>${esc(current.name)}:</b> „${esc(current.reason)}“</p><p>„Ich kann Ihnen meinen Ausweis und meine Unterlagen zeigen.“</p><button class="btn good" onclick="closePanel()">Gespräch beenden</button>`);$('dialog').innerHTML='<b>'+esc(current.name)+'</b><br>„'+esc(current.reason)+'“'}function showID(){checked=true;const p=current;panel(`<button class="x" onclick="closePanel()">×</button><h2>🪪 Ausweiskontrolle</h2><div class="id"><div style="display:flex;justify-content:space-between;font-size:10px;font-weight:900"><span>STADTVERBUND · IDENTITÄTSKARTE</span><span>№ ${p.id}</span></div><div class="idflex" style="margin-top:12px">${imageTag(p)}<div class="details">VOR- UND NACHNAME<br><b>${esc(p.name)}</b><br>GEBURTSDATUM: ${p.dob}<br>GEBURTSORT: ${esc(p.city)}<br>AUSWEIS-NR.: ${p.id}</div></div></div><p>Vergleiche Name, Nummer und Foto mit der heutigen Zugangsliste.</p><button class="btn good" onclick="closePanel()">Ausweis weglegen</button>`)}function showList(){panel(`<button class="x" onclick="closePanel()">×</button><h2>📋 Heutige Zugangsliste</h2><div class="paper"><h3>GESICHERTER BEREICH</h3><p>✓ Mina Demir — 48291</p><p>✓ Samira Haddad — 11573</p><p>✓ Dr. Clara Neumann — 90511</p></div><p>Andere Personen können den öffentlichen Empfang nutzen, aber nicht automatisch in den Sicherheitsbereich.</p><button class="btn good" onclick="closePanel()">Zurück</button>`)}function colleague(){panel(`<button class="x" onclick="closePanel()">×</button><h2>👮 Kollege Berger</h2><p>„Was ist los? Ich kann kurz nachsehen.“</p><button class="btn" onclick="colleagueAnswer(0)">Kennst du diese Person?</button><button class="btn" onclick="colleagueAnswer(1)">Zeig mir die Fallakte.</button><button class="btn bad" onclick="colleagueAnswer(2)">Kollege, komm zur Sicherung!</button>`)}function colleagueAnswer(n){let t=n===0?(current.listed?'„Ja, der Name steht auf unserer Zugangsliste.“':'„Die Person ist nicht für den Sicherheitsbereich vorgemerkt.“'):n===1?current.story:'„Ich komme zur Schleuse. Eine Festnahme ist nur bei einem konkreten rechtlichen Grund möglich. Prüfe zuerst die Hinweise.“';panel(`<button class="x" onclick="closePanel()">×</button><h2>${n===1?'📁 Fallakte':'👮 Kollegenauskunft'}</h2><div class="paper"><p>${esc(t)}</p></div><button class="btn" onclick="colleague()">Weitere Frage</button><button class="btn good" onclick="closePanel()">Zurück</button>`)}function documents(){panel(`<button class="x" onclick="closePanel()">×</button><h2>📑 Vorgelegte Unterlagen</h2><div class="paper"><h3>${esc(current.name)}</h3><p>${esc(current.docs)}</p><p>Aktennotiz: ${esc(current.story)}</p></div><button class="btn good" onclick="closePanel()">Unterlagen weglegen</button>`)}function skeletonSvg(){return `<svg viewBox="0 0 150 240" aria-label="Schematische Sicherheitskontrolle"><g stroke="#a8e7ec" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="75" cy="30" r="19"/><path d="M65 47L75 61L85 47M75 61V155M49 75Q75 61 101 75M49 75L38 125L31 145M101 75L112 125L119 145M54 83L75 97L96 83M53 96L75 110L97 96M56 109L75 123L94 109M59 123L75 134L91 123M75 155L58 170L54 223M75 155L92 170L96 223M64 158Q75 170 86 158"/></g><g fill="#b8f2f5"><circle cx="75" cy="30" r="4"/><circle cx="31" cy="145" r="5"/><circle cx="119" cy="145" r="5"/></g></svg>`}function scanner(){scanned=true;let danger=current.threat;panel(`<button class="x" onclick="closePanel()">×</button><h2>🔍 Sicherheits-Scanner</h2><p>Fiktiver Körperscan: Metallische Gegenstände werden hervorgehoben.</p><div class="scanbox">${skeletonSvg()}<div class="scanline"></div><div class="hotspot" style="left:${danger?'66':'24'}%;top:${danger?'46':'68'}%"></div></div><p><b>${danger?'⚠ Sicherheitswarnung':'✓ Gegenstand erkannt'}:</b> ${esc(current.metal)}</p><p class="tiny">Ein harmloser Metallgegenstand ist kein Grund für eine Festnahme. Bei einer konkreten Gefahr den Kollegen hinzuziehen.</p><button class="btn good" onclick="closePanel()">Scan abschließen</button>`)}function stamp(){panel(`<button class="x" onclick="closePanel()">×</button><h2>📄 Zutrittsentscheidung</h2><div class="paper"><h3>ZUTRITTSANTRAG</h3><p>${esc(current.name)} · Nr. ${current.id}</p><p>Grund: ${esc(current.reason)}</p><hr><p>Entscheidung: ______________</p></div><p>Stemple den Antrag oder veranlasse bei konkreter Gefahr eine Sicherung durch die Polizei.</p><div class="btnrow"><button class="btn good" onclick="decide('allow')">✓ GRÜN</button><button class="btn bad" onclick="decide('deny')">✕ ROT</button><button class="btn gold" onclick="decide('detain')">⚠ GEWAHRSAM</button></div>`)}function decide(choice){let correct=choice===current.outcome;let amount=correct?(choice==='detain'?140:80):-40;money+=amount;shiftPay+=amount;save();idx++;if(idx>=5){endShift();return}spawn();panel(`<h2>${correct?'✓ Richtig entschieden':'⚠ Kontrollfehler'}</h2><p>${correct?'Deine Entscheidung war mit den überprüften Hinweisen vereinbar.':'Prüfe beim nächsten Mal Ausweis, Zugangsliste und konkrete Gefahrenlage genauer.'}</p><p><b>${amount>0?'+':''}${amount} €</b></p><button class="btn good" onclick="closePanel()">Nächste Person →</button>`)}function endShift(){scene='summary';$('actions').classList.add('hidden');$('dialog').classList.add('hidden');panel(`<div class="tag">SCHICHTENDE</div><h1>Feierabend</h1><p>Du hast heute fünf Personen kontrolliert. Die Kolleginnen und Kollegen übernehmen die Nachtschicht.</p><div class="paper"><h3>TAGESABRECHNUNG</h3><p>Heutiger Verdienst: <b>${shiftPay>0?'+':''}${shiftPay} €</b></p><p>Gesamtvermögen: <b>${money} €</b></p></div><button class="btn good" onclick="goHome()">Nach Hause fahren →</button>`)}function goHome(){scene='home';beer=0;$('stage').innerHTML=`<div class="scene home"><div class="tv"><div class="tvscreen"><small>LIVE · ABENDJOURNAL</small><b>REGIONALNACHRICHTEN</b><small>Die Stadt schläft nie.</small></div></div><div class="sofa"></div><div class="tablehome"></div><div class="bottles">🍺 🍺</div><div class="phoneprop">📱</div></div>`;$('homeactions').classList.remove('hidden');$('actions').classList.add('hidden');$('dialog').classList.add('hidden');closePanel();header()}function newsForDay(){let special=day%4===0||day%7===0;return special?{headline:'POLIZEI SUCHT PERSON NACH EINBRUCHSERIE',body:'Eine Person soll sich mit fremden Ausweisdaten Zugang zu gesicherten Gebäuden verschafft haben. Hinweise aus der Bevölkerung werden geprüft.',photo:people[3]}:{headline:'STADT AKTUELL: NEUE SICHERHEITSMASSNAHMEN',body:'Im Stadtgebiet werden öffentliche Gebäude besser gesichert. Die Behörden erinnern daran, dass Zeugen auch ohne Termin Hilfe erhalten können.',photo:null}}function newsHtml(){let n=newsForDay();return `<div class="tag">ABENDNACHRICHTEN · TAG ${day}</div><div class="newsimg">${n.photo?imageTag(n.photo):'🎙️ 📺'}</div><h2>${esc(n.headline)}</h2><p>Moderatorin: „Guten Abend. ${esc(n.body)}“</p><p class="tiny">Die Nachrichten sind Teil der fiktiven Spielwelt. Besondere Fahndungen erscheinen nur an einzelnen Tagen.</p>`}function watchTV(){panel(`<button class="x" onclick="closePanel()">×</button><h2>📺 Fernsehen</h2>${newsHtml()}<button class="btn good" onclick="closePanel()">Fernseher verlassen</button>`)}function drink(){beer++;if(beer>=3){panel(`<h2>😴 Du nickst ein</h2><p>Nach dem dritten Schluck werden deine Augen schwer. Der Fernseher läuft noch, während du auf dem Sofa einschläfst.</p><button class="btn good" onclick="nextDay()">Am nächsten Morgen aufwachen →</button>`)}else{panel(`<h2>🍺 Feierabend</h2><p>Du nimmst einen Schluck. ${beer===1?'Endlich Ruhe nach dem langen Dienst.':'Langsam wirst du müde.'}</p><p>Schluck ${beer} von 3</p><button class="btn good" onclick="closePanel()">Zurück zum Sofa</button>`)}}function nextDay(){day++;save();menu()}function phoneShell(body,title='SMARTPHONE'){panel(`<button class="x" onclick="closePanel()">×</button><div class="phone"><div class="phoneheader"><span>21:47</span><b>${title}</b><span>●●● 92%</span></div>${body}</div><button class="btn" onclick="phoneHome()">⌂ Startbildschirm</button><button class="btn good" onclick="closePanel()">Handy weglegen</button>`)}function phoneHome(){phoneShell(`<div class="apps"><button class="appicon" onclick="contacts()"><span>👥</span>Kontakte</button><button class="appicon" onclick="messages()"><span>💬</span>Nachrichten</button><button class="appicon" onclick="worldNews()"><span>🌍</span>Weltnachrichten</button><button class="appicon" onclick="social()"><span>🗨️</span>Pulse · Social</button></div>`)}function contacts(){phoneShell(`<div class="message"><b>👮 Kollege Berger</b><br>Polizeirevier · Dienststelle</div><div class="message"><b>👩 Lea</b><br>Freundin · erreichbar</div><div class="message"><b>👨 Tom</b><br>Alter Schulfreund</div><button class="btn" onclick="messages()">Nachrichten öffnen</button>`,'KONTAKTE')}function messages(){phoneShell(`<div class="message"><b>👮 Berger · 20:11</b><br>Gute Arbeit heute. Morgen wird's vermutlich voller.</div><div class="message"><b>👩 Lea · 19:35</b><br>Hey! Wie war dein Tag? Meld dich mal 😊</div><div class="message"><b>👨 Tom · 17:20</b><br>Hast du am Wochenende Zeit?</div><button class="btn good" onclick="replyMessenger()">Lea antworten</button>`,'NACHRICHTEN')}function replyMessenger(){phoneShell(`<div class="message"><b>Du → Lea</b><br>War ein langer Tag im Revier. Bin endlich daheim.</div><div class="message"><b>Lea</b><br>Dann ruh dich aus! Erzähl mir morgen mehr. ❤️</div>`,'CHAT · LEA')}function worldNews(){phoneShell(newsHtml(),'WELTNACHRICHTEN')}const seedPosts=[{who:'Donut Flump ✓',txt:'Meine Sicherheitsidee ist die beste. Wirklich die beste. Riesig!',likes:1240},{who:'Michelle B. Cordon ✓',txt:'Neuer Film, neue Rolle. Bleibt gespannt 🎬',likes:860},{who:'Stadtfunk',txt:'Wer heute Abend noch unterwegs ist: Achtet auf euch.',likes:82}];function reactions(txt){let s=txt.toLowerCase();if(/arbeit|schicht|chef|kollege|polizei|revi/.test(s))return ['Berger: Das klingt nach einem harten Dienst.','Stadtfunk: Was ist denn heute passiert?'];if(/müd|schlaf|stress|traurig|schlecht/.test(s))return ['Lea: Ruh dich heute Abend aus ❤️','Tom: Morgen sieht die Welt schon anders aus.'];if(/gut|glück|freu|super|toll/.test(s))return ['Michelle B. Cordon: Love the energy!','Tom: Stark! Freut mich für dich.'];return ['Stadtfunk: Interessanter Gedanke.','Donut Flump: Darüber sollten wir reden!']}function social(){let own=posts.slice().reverse().map((p,i)=>`<div class="post"><b>Du · @NightGuard</b><br>${esc(p.text)}<br><small>❤️ ${p.likes} · 🔁 ${p.shares} · 💬 ${p.replies.length}</small>${p.replies.map(r=>`<div class="message">${esc(r)}</div>`).join('')}</div>`).join('');let seeded=seedPosts.map(p=>`<div class="post"><b>${esc(p.who)}</b><br>${esc(p.txt)}<br><small>❤️ ${p.likes.toLocaleString('de-DE')} · 🔁 21</small></div>`).join('');phoneShell(`<p class="tiny">Dein eigener Social-Feed in der Spielwelt.</p><textarea id="postInput" class="postbox" maxlength="240" placeholder="Was beschäftigt dich heute?"></textarea><button class="btn good" onclick="publishPost()">Beitrag posten</button><div id="feed">${own}${seeded}</div>`,'PULSE · SOCIAL')}function publishPost(){let e=$('postInput');if(!e)return;let txt=e.value.trim();if(!txt)return;let r=reactions(txt);let likes=4+Math.min(45,txt.length);posts.push({text:txt,likes,shares:Math.max(1,Math.floor(likes/5)),replies:r});if(posts.length>30)posts.shift();save();social()}menu();
</script></body></html>
