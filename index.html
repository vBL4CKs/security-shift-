.entrydoor{position:absolute;z-index:1;left:35%;top:22%;width:30%;height:47%;border:11px solid #162532;border-radius:12px 12px 0 0;background:linear-gradient(120deg,#122330,#37505b 55%,#152b39);box-shadow:0 0 0 3px #607b87,0 16px 30px #0008;overflow:hidden;perspective:500px}

.visitor.leaving-reject{animation:visitorRejected 1.55s ease-in both!important}

.visitor.leaving-reject .comic-character,.visitor.leaving-allow .comic-character,.visitor.leaving-detain .comic-character{animation:walkSway .27s ease-in-out infinite alternate}

let chatTimers={};
function getChatState(id){if(!chatHistory[id]||!Array.isArray(chatHistory[id].messages)){chatHistory[id]={turn:0,messages:[[chatPeople.find(x=>x.id===id).name,chatThemes[id].opening]]}}return chatHistory[id]}
function saveChats(){try{localStorage.setItem('nightshift-chats-v2',JSON.stringify(chatHistory))}catch{}}
function contacts(){phoneShell(chatPeople.map(c=>`<button class="btn" style="width:100%;text-align:left" onclick="chat('${c.id}')">${c.icon} <b>${c.name}</b> <span class="tiny">· ${c.role}</span></button>`).join(''),'KONTAKTE')}
function messages(){phoneShell(chatPeople.map(c=>{let h=getChatState(c.id).messages;return `<button class="btn" style="width:100%;text-align:left" onclick="chat('${c.id}')">${c.icon} <b>${c.name}</b><br><span class="tiny">${esc(h[h.length-1][1]).slice(0,70)}</span></button>`}).join(''),'MESSENGER')}
function replyChoices(id,turn){let set=chatAnswers[turn%chatAnswers.length];if(id==='berger' && turn%6===3)set=[['Ich rufe bei konkreter Gefahr Verstärkung.','Genau. Eigenschutz hat Priorität.'],['Ich überprüfe zuerst den Sachverhalt.','Richtig. Eine Festnahme braucht einen Grund.'],['Ich dokumentiere alles sorgfältig.','Sehr gut. Saubere Dokumentation hilft uns.']];return set}
function chat(id){let c=chatPeople.find(x=>x.id===id);if(!c)return;let st=getChatState(id);let bubbles=st.messages.map(m=>`<div class="message ${m[0]==='Du'?'mine':''}"><b>${esc(m[0])}</b><br>${esc(m[1])}</div>`).join('');let pending=!!chatTimers[id];let choices=pending?'<div class="typing"><i></i><i></i><i></i><span>schreibt …</span></div>':replyChoices(id,st.turn).map((r,i)=>`<button class="btn chat-choice" onclick="sendChat('${id}',${i})">${esc(r[0])}</button>`).join('');phoneShell(`<div class="chatlog" id="chatlog">${bubbles}${pending?choices:''}</div>${pending?'':`<p class="tiny">Wähle eine Antwort · Gespräch ${Math.min(st.turn+1,20)}/20</p>${choices}`}<p class="tiny">Du kannst beliebig weiterschreiben. Die Antworten sind vorgefertigt und hängen von Gesprächsphase und Auswahl ab.</p>`,'CHAT · '+c.name);let log=$('chatlog');if(log)log.scrollTop=log.scrollHeight}
function sendChat(id,i){let c=chatPeople.find(x=>x.id===id);if(!c||chatTimers[id])return;let st=getChatState(id),turn=st.turn,opts=replyChoices(id,turn),pair=opts[i];if(!pair)return;st.messages.push(['Du',pair[0]]);saveChats();chatTimers[id]=true;chat(id);chatTimers[id]=setTimeout(()=>{let t=chatThemes[id].topics[turn%chatThemes[id].topics.length];let response=turn%3===0?pair[1]+' '+t[1]:turn%3===1?pair[1]+' '+t[2]:pair[1]+' '+chatThemes[id].topics[(turn+1)%6][1];st.messages.push([c.name,response]);st.turn++;if(st.messages.length>90)st.messages=st.messages.slice(-90);clearTimeout(chatTimers[id]);delete chatTimers[id];saveChats();if($('overlay').innerHTML.includes('CHAT · '+c.name))chat(id)},950+((turn%3)*350))}

function activeEpisode(){return Math.min(Math.floor((day-1)/2),storyEpisodes.length-1)}
function showCareer(){let r=rank(),next=rankLevels.find(x=>x.min>storyState.xp);panel(`<button class="x" onclick="closePanel()">×</button><div class="story-tag">PERSONALAKTE</div><h2>🏅 Karriere & Entwicklung</h2><div class="story-card"><span class="rankpill">${r.name}</span><p>Erfahrung: <b>${storyState.xp} XP</b> · Dienstlicher Ruf: ${reputation}%</p><p>Schichtbonus: <b>+${r.pay} €</b></p><p>${next?'Nächste Beförderung: '+next.name+' ab '+next.min+' XP':'Höchste Stufe erreicht'}</p><p>Energie: ${storyState.energy}% · Beziehungen: ${storyState.relationship}%</p></div><p>Gute Entscheidungen bringen Erfahrung. Schwere Fehler können deinen Ruf und deine Karriere beschädigen.</p><button class="btn good" onclick="closePanel()">Schließen</button>`)}
function showJournal(){let ep=storyEpisodes[activeEpisode()];panel(`<button class="x" onclick="closePanel()">×</button><div class="story-tag">ERMITTLUNGSMAPPE K-17</div><h2>🗂️ Falltagebuch</h2><div class="story-card"><h3>${esc(ep.title)}</h3><p>${esc(ep.hint)}</p><p>${storyState.solved.includes(activeEpisode())?'✓ Kapitel abgeschlossen':'● Offene Ermittlungen'}</p></div><div class="evidence-grid">${storyState.clues.length?storyState.clues.map(c=>`<div class="evidence">🔎 ${esc(c)}<small>Gesicherter Hinweis</small></div>`).join(''):'<div class="evidence">Noch keine Hinweise gesammelt</div>'}</div><h3>Letzte Ereignisse</h3><div class="timeline">${storyState.diary.slice(0,8).map(x=>`<p><b>Tag ${x.day}</b> · ${esc(x.message)}</p>`).join('')||'<p>Deine Geschichte beginnt heute.</p>'}</div><button class="btn good" onclick="investigate()">Fall untersuchen</button><button class="btn" onclick="closePanel()">Schließen</button>`)}
function investigate(){let n=activeEpisode(),ep=storyEpisodes[n];if(storyState.solved.includes(n)){panel(`<h2>✓ Kapitel abgeschlossen</h2><p>${esc(ep.clue)}</p><button class="btn good" onclick="showJournal()">Zur Ermittlungsmappe</button>`);return}panel(`<div class="story-tag">AKTE K-17 · KAPITEL ${n+1}</div><h2>${esc(ep.title)}</h2><p>${esc(ep.hint)}</p><div class="paper"><h3>DETEKTIVAUFGABE</h3><p>${esc(ep.task)}</p></div>${ep.answers.map((a,i)=>`<button class="investigate-btn" onclick="solveEpisode(${n},${i})">${i+1}. ${esc(a)}</button>`).join('')}<button class="btn" onclick="showJournal()">Später prüfen</button>`)}
function solveEpisode(n,choice){if(storyState.solved.includes(n))return;let ep=storyEpisodes[n];if(choice!==ep.right){storyState.energy=Math.max(10,storyState.energy-5);addDiary('Eine Ermittlungshypothese war nicht ausreichend belegt.');panel(`<h2>⚠ Unzureichende Beweise</h2><p>Diese Schlussfolgerung passt nicht zu den vorhandenen Hinweisen. Prüfe die Angaben erneut.</p><button class="btn good" onclick="investigate()">Erneut prüfen</button>`);return}storyState.solved.push(n);storyState.clues.push(ep.clue);storyState.xp+=4;money+=ep.reward;reputation=Math.min(100,reputation+3);addDiary('Ermittlung abgeschlossen: '+ep.title);saveStory();save();header();panel(`<div class="story-tag">NEUER HINWEIS GESICHERT</div><h2>✓ ${esc(ep.title)}</h2><div class="story-card"><p>🔎 ${esc(ep.clue)}</p></div><p>+${ep.reward} € Ermittlungsprämie · +4 XP · Ruf +3</p><button class="btn good" onclick="showJournal()">Ermittlungsmappe öffnen</button>`)}
function showPersonalLife(){panel(`<button class="x" onclick="closePanel()">×</button><div class="story-tag">FEIERABEND</div><h2>🏠 Dein Privatleben</h2><div class="story-card"><p>Energie: <b>${storyState.energy}%</b></p><p>Beziehungen: <b>${storyState.relationship}%</b></p><p>Besitz: ${owned.length} Gegenstände · Geld: ${money} €</p></div><button class="investigate-btn" onclick="restAtHome()">🛋️ Auf dem Sofa ausruhen (+20 Energie)</button><button class="investigate-btn" onclick="callFriend()">📞 Einen Freund anrufen</button><button class="investigate-btn" onclick="showGarage()">🚗 Garage & Fahrzeuge</button><button class="investigate-btn" onclick="showJournal()">🗂️ Ermittlungsmappe lesen</button><button class="btn" onclick="closePanel()">Zurück</button>`)}
function restAtHome(){storyState.energy=Math.min(100,storyState.energy+20);addDiary('Nach der Arbeit auf dem Sofa entspannt.');panel(`<h2>🛋️ Kurze Pause</h2><p>Du entspannst dich auf dem Sofa. Energie: ${storyState.energy}%.</p><button class="btn good" onclick="showPersonalLife()">Weiter</button>`)}
function callFriend(){panel(`<h2>📞 Tom ruft zurück</h2><p>„Hey! Du klingst müde. Wie läuft die Arbeit?“</p><button class="investigate-btn" onclick="friendResponse(0)">Von einem schwierigen Fall erzählen</button><button class="investigate-btn" onclick="friendResponse(1)">Ein Treffen am Wochenende vorschlagen</button><button class="investigate-btn" onclick="friendResponse(2)">Sagen, dass du Ruhe brauchst</button>`)}
function friendResponse(i){const answers=['„Klingt spannend, aber pass auf dich auf.“','„Klar, wir gehen am Wochenende etwas essen!“','„Verstanden, wir sprechen morgen. Schlaf gut!“'];storyState.relationship=Math.max(0,Math.min(100,storyState.relationship+(i===1?9:i===0?4:1)));addDiary('Mit Tom telefoniert.');panel(`<h2>📞 Tom</h2><p>${answers[i]}</p><p>Beziehungen: ${storyState.relationship}%</p><button class="btn good" onclick="showPersonalLife()">Gespräch beenden</button>`)}
function showGarage(){let vehicles=catalog.filter(x=>x.cat==='Fahrzeuge');panel(`<button class="x" onclick="closePanel()">×</button><div class="story-tag">TIEFGARAGE</div><h2>🚗 Meine Fahrzeuge</h2>${vehicles.map(v=>`<div class="story-card"><h3>${v.icon} ${esc(v.name)}</h3><p>${owned.includes(v.id)?'✓ In deinem Besitz · Bereit zur Fahrt':'Nicht gekauft · '+v.price.toLocaleString('de-DE')+' €'}</p>${owned.includes(v.id)?`<button class="btn good" onclick="driveVehicle('${v.id}')">Probefahrt starten</button>`:`<button class="btn" onclick="openLaptop()">Im CityMarkt ansehen</button>`}</div>`).join('')}<button class="btn" onclick="showPersonalLife()">Zurück</button>`)}
function driveVehicle(id){let v=catalog.find(x=>x.id===id);if(!v||!owned.includes(id))return;storyState.energy=Math.max(10,storyState.energy-6);addDiary('Eine Runde mit '+v.name+' gefahren.');panel(`<div class="story-tag">ABENDFAHRT</div><h2>${v.icon} ${esc(v.name)}</h2><p>Du fährst durch die beleuchtete Stadt. Die Straßen sind ruhig, im Radio läuft das Nachtjournal.</p><p>Energie: ${storyState.energy}%</p><button class="btn good" onclick="showGarage()">Zur Garage</button>`)}
function addHomeExtras(){if(scene!=='home')return;let root=$('stage').querySelector('.home');if(!root||root.querySelector('.home-extra'))return;root.insertAdjacentHTML('beforeend',`<button class="home-extra journal" onclick="showJournal()">🗂️ Fallakte</button><button class="home-extra garage" onclick="showGarage()">🚗 Garage</button><button class="home-extra friend" onclick="showPersonalLife()">❤️ Privatleben</button>`)}
// Add new characters with distinct cases and recurring clues.
people.push(
{name:'Viktor Falk',dob:'01.04.1978',city:'Leipzig',id:'88201',photo:6,reason:'Ich habe Unterlagen zum Fall K-17. Jemand hat die Akten geändert.',listed:false,threat:false,metal:'Schlüssel und USB-Stick',docs:'Umschlag mit Aktenzeichen K-17',story:'Der Umschlag ist am öffentlichen Schalter abzugeben. Kein gesicherter Zutritt.',outcome:'counter',style:'coat'},
{name:'Tessa Brandt',dob:'09.02.1998',city:'Ulm',id:'91442',photo:2,reason:'Ich soll zur Zeugenaussage in Raum 203. Ich habe eine neue Information.',listed:true,threat:false,metal:'Smartphone',docs:'Bestätigte Vorladung, 13:30 Uhr, Raum 203',story:'Sie ist als Zeugin eingetragen und kann begleitet zu Raum 203.',outcome:'witness',style:'blazer'},
{name:'Noah Keller',dob:'26.10.1999',city:'Bremen',id:'81222',photo:1,reason:'Ich trage ein Halloween-Kostüm. Mein Fahrrad wurde gestohlen.',listed:false,threat:false,metal:'Kostüm-Reißverschluss',docs:'Kaufbeleg des Fahrrads',story:'Trotz auffälligem Kostüm ist der Besucher harmlos. Anzeige am Schalter.',outcome:'counter',costume:'🎭',style:'halloween'}
);
const oldSave=save;save=function(){oldSave();saveStory()};
const oldMenu=menu;menu=function(){oldMenu();let p=$('overlay').querySelector('.panel');if(p){let r=rank();p.insertAdjacentHTML('afterbegin',`<div class="story-card"><span class="story-tag">AKTUELLER STORYBOGEN · K-17</span><h3>${esc(storyEpisodes[activeEpisode()].title)}</h3><p>${esc(storyEpisodes[activeEpisode()].hint)}</p><span class="rankpill">${r.name} · ${storyState.xp} XP</span><div><button class="btn" onclick="showJournal()">🗂️ Ermittlungen</button><button class="btn" onclick="showCareer()">🏅 Karriere</button></div></div>`)}};
const oldBriefing=briefing;briefing=function(){oldBriefing();let p=$('overlay').querySelector('.panel');if(p)p.insertAdjacentHTML('beforeend',`<div class="story-card"><div class="story-tag">HINWEIS AUS DER ERMITTLUNG</div><p>${esc(storyEpisodes[activeEpisode()].hint)}</p><button class="btn" onclick="investigate()">Fallakte prüfen</button></div>`)};
const oldDecide=decide;decide=function(choice){let before=rank().name,correct=choice===current.outcome,name=current.name;oldDecide(choice);if(correct){storyState.xp+=1;storyState.energy=Math.max(15,storyState.energy-2)}else{storyState.energy=Math.max(10,storyState.energy-7)}addDiary((correct?'Korrekt entschieden: ':'Fehlentscheidung bei ')+name+'.');if(rank().name!==before){addDiary('Beförderung: '+rank().name);setTimeout(()=>{if(scene==='work')panel(`<div class="story-tag">BEFÖRDERUNG</div><h2>🏅 ${rank().name}</h2><p>Deine sorgfältige Arbeit zahlt sich aus. Du erhältst künftig einen höheren Schichtbonus.</p><button class="btn good" onclick="closePanel()">Weiter</button>`)},2200)}saveStory()};
const oldEndShift=endShift;endShift=function(){let bonus=rank().pay;if(bonus){money+=bonus;shiftPay+=bonus;save();header()}oldEndShift();let p=$('overlay').querySelector('.panel');if(p)p.insertAdjacentHTML('beforeend',`<div class="story-card"><span class="story-tag">KARRIERE & GESCHICHTE</span><p>${esc(rank().name)} · ${storyState.xp} XP · Schichtbonus +${bonus} €</p><p>${esc(storyEpisodes[activeEpisode()].hint)}</p><button class="btn" onclick="showJournal()">Falltagebuch</button></div>`)};
const oldGoHome=goHome;goHome=function(){oldGoHome();addHomeExtras()};
const oldGoToSleep=goToSleep;goToSleep=function(){storyState.energy=Math.min(100,storyState.energy+35);saveStory();oldGoToSleep()};
const oldStartShift=startShift;startShift=function(){oldStartShift();let stage=$('stage');if(stage)stage.classList.remove('flash-alert')};
const oldShowEmergency=showEmergency;showEmergency=function(){oldShowEmergency();if(scene==='work'){$('stage').classList.add('flash-alert');setTimeout(()=>$('stage').classList.remove('flash-alert'),2500)}};
const oldPhoneHome=phoneHome;phoneHome=function(){oldPhoneHome();let p=$('overlay').querySelector('.panel');if(p)p.insertAdjacentHTML('beforeend',`<button class="btn" onclick="showJournal()">🗂️ Fall K-17</button><button class="btn" onclick="showCareer()">🏅 Karriere</button>`)};
const oldShowList=showList;showList=function(){oldShowList();if(day<=5){let p=$('overlay').querySelector('.panel');if(p)p.insertAdjacentHTML('beforeend',`<button class="btn" onclick="showJournal()">🔎 Fall K-17 untersuchen</button>`)}};

menu();
</script></body></html>
